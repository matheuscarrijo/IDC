name: Fetch BCB release
run-name: BCB release ${{ inputs.period }}

on:
  workflow_dispatch:
    inputs:
      period:
        description: Nominal BCB release period in YYYYMM format
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official BCB files
        env:
          BCB_RELEASE_PERIOD: ${{ inputs.period }}
        run: >-
          python -m src.download_bcb_release
          "$BCB_RELEASE_PERIOD"
          --output-dir "${{ runner.temp }}/raw"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcb-release-${{ inputs.period }}
          path: ${{ runner.temp }}/raw/${{ inputs.period }}/
          if-no-files-found: error
          retention-days: 3
